name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ucb_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: ucb_group_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ucb_test -d ucb_group_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            miniapp/requirements.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q bot.py bot_mexc.py bingx core evaluation mexc miniapp trading

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://ucb_test:local-test-only@127.0.0.1:5432/ucb_group_tests
        run: python -m pytest -q

      - name: Validate Mini App JavaScript and display catalogs
        run: |
          node --check miniapp/static/app.js
          node --check miniapp/static/asset-icons.js
          node --check miniapp/static/asset-groups.js
          node --test tests/asset_icons.test.cjs
          node --test tests/asset_groups.test.cjs

      - name: Static security scan
        run: bandit -q -r bot.py bot_mexc.py bingx core evaluation mexc miniapp trading -x tests -ll -iii

      - name: Dependency vulnerability scan
        run: |
          mapfile -t accepted < <(grep -vE '^(#|$)' .github/accepted-vulnerabilities.txt)
          args=()
          for vulnerability in "${accepted[@]}"; do
            args+=(--ignore-vuln "$vulnerability")
          done
          pip-audit -r miniapp/requirements.txt "${args[@]}"
          pip-audit -r requirements.txt "${args[@]}"
