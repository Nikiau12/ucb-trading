name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            miniapp/requirements.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q bot_mexc.py core mexc miniapp trading

      - name: Run tests
        run: python -m pytest -q

      - name: Static security scan
        run: bandit -q -r bot_mexc.py core mexc miniapp trading -x tests -ll -iii

      - name: Dependency vulnerability scan
        run: |
          mapfile -t accepted < <(grep -vE '^(#|$)' .github/accepted-vulnerabilities.txt)
          args=()
          for vulnerability in "${accepted[@]}"; do
            args+=(--ignore-vuln "$vulnerability")
          done
          pip-audit -r miniapp/requirements.txt "${args[@]}"
          pip-audit -r requirements.txt "${args[@]}"
